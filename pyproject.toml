[project]
name = "python-serialization-benchmark"
version = "0.1.0"
description = "A reproducible benchmark of maintained Python serialization libraries"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django==6.1.1",
    "djangorestframework==3.18.0",
    "marshmallow==4.3.1",
]

[project.scripts]
serialization-benchmark = "serialization_benchmark.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "serialization_benchmark"
module-root = ""

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
