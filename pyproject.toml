[project]
name = "python-serialization-benchmark"
version = "0.1.0"
description = "A reproducible benchmark of maintained Python serialization libraries"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "adaptix==3.0.0b12",
    "avro==1.12.2",
    "cattrs==26.2.0",
    "django==6.1.1",
    "djangorestframework==3.18.0",
    "marshmallow==4.3.1",
    "mashumaro==3.22",
    "msgpack==1.2.2",
    "msgspec==0.21.1",
    "orjson==3.12.0",
    "ormsgpack==1.12.2",
    "pydantic==2.13.5",
    "pyperf==2.10.0",
    "serpyco-rs==1.22.0",
]

[project.scripts]
serialization-benchmark = "serialization_benchmark.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "serialization_benchmark"
module-root = ""

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
